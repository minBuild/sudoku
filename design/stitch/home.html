<body class="min-h-screen bg-[#F5F6FA] text-[#1F2937] flex justify-center selection:bg-[#EDF2FF] selection:text-[#3B5BDB]">
<!-- Mobile Viewport Container (~390px width) -->
<main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between px-5 pt-8 pb-7 mx-auto relative box-border">
<!-- Top Area: Header Branding -->
<header class="flex flex-col items-center text-center mt-2 mb-6">
<!-- 3x3 Minimal Sudoku Icon Platter -->
<div class="w-14 h-14 rounded-2xl bg-[#EDF2FF] flex items-center justify-center p-3 mb-3.5 shadow-[0_2px_10px_rgba(59,91,219,0.08)]">
<div class="grid grid-cols-3 grid-rows-3 gap-[3.5px] w-full h-full">
<span class="bg-[#3B5BDB] rounded-[2px] opacity-90"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-40"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-90"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-30"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-100"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-35"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-80"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-30"></span>
<span class="bg-[#3B5BDB] rounded-[2px] opacity-85"></span>
</div>
</div>
<!-- App Title & Tagline -->
<h1 class="text-[28px] font-bold text-[#1F2937] tracking-tight leading-tight">스도쿠</h1>
<p class="text-sm font-normal text-[#6B7280] mt-1 tracking-tight">차분하게 한 칸씩</p>
</header>
<!-- Center Interactive Content -->
<div class="flex flex-col gap-4 w-full">
<!-- 2. "이어하기" (Continue Game) Card -->
<section class="bg-white rounded-[16px] border border-[#E5E7EB] p-5 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] transition-all">
<!-- Card Header -->
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="flex h-2 w-2 relative">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#3B5BDB] opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-[#3B5BDB]"></span>
</span>
<span class="text-sm font-semibold text-[#1F2937] tracking-tight">이어하기</span>
</div>
<!-- Difficulty Badge -->
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#EDF2FF] text-[#3B5BDB]">
            보통
          </span>
</div>
<!-- Progress Metrics -->
<div class="space-y-2 mb-4">
<div class="flex items-center justify-between text-xs text-[#6B7280]">
<span class="flex items-center gap-1 font-medium">
              진행도
            </span>
<span class="font-semibold text-[#1F2937]">42%</span>
</div>
<!-- Sleek Progress Bar -->
<div class="w-full h-2 bg-[#EDF2FF] rounded-full overflow-hidden">
<div class="h-full bg-[#3B5BDB] rounded-full transition-all duration-500 ease-out" style="width: 42%;"></div>
</div>
</div>
<!-- Elapsed Time Indicator -->
<div class="flex items-center justify-between py-2 px-3 rounded-lg bg-[#F8FAFD] border border-[#EDF2FF] mb-4">
<span class="text-xs text-[#6B7280] font-normal flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-[#6B7280]" data-icon="schedule">schedule</span>
            경과 시간
          </span>
<span class="text-xs font-semibold text-[#1F2937] tracking-wider tabular-nums">12:34</span>
</div>
<!-- Resume Action Button -->
<button class="w-full bg-[#3B5BDB] text-white hover:bg-[#364fc7] rounded-[14px] min-h-[48px] flex items-center justify-center font-medium shadow-sm active:scale-[0.99] transition-all duration-150" type="button">
<span class="text-sm font-medium">이어하기</span>
</button>
</section>
<!-- 3. Main Action Buttons -->
<div class="flex flex-col gap-2.5">
<!-- New Game Primary Button -->
<button class="w-full min-h-[52px] bg-[#3B5BDB] hover:bg-[#364fc7] text-white font-semibold rounded-[14px] flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="add_circle">add_circle</span>
<span class="text-base tracking-tight font-semibold">새 게임</span>
</button>
<!-- Secondary Buttons (Grid) -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Statistics / History Button -->
<button class="bg-white border border-[#E5E7EB] text-[#1F2937] hover:bg-gray-50 rounded-[14px] min-h-[48px] flex items-center justify-center gap-2 font-medium active:scale-[0.99] transition-all duration-150 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.03)]" type="button">
<span class="material-symbols-outlined text-[19px] text-[#6B7280]" data-icon="analytics">analytics</span>
<span class="text-sm">기록</span>
</button>
<!-- Settings Button -->
<button class="bg-white border border-[#E5E7EB] text-[#1F2937] hover:bg-gray-50 rounded-[14px] min-h-[48px] flex items-center justify-center gap-2 font-medium active:scale-[0.99] transition-all duration-150 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.03)]" type="button">
<span class="material-symbols-outlined text-[19px] text-[#6B7280]" data-icon="settings">settings</span>
<span class="text-sm">설정</span>
</button>
</div>
</div>
</div>
<!-- 4. "광고 제거" (Remove Ads) Bottom Card -->
<section class="bg-white rounded-[16px] border border-[#E5E7EB] p-4 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.04)] mt-6">
<div class="flex items-start justify-between mb-3">
<div class="space-y-0.5">
<h2 class="text-sm font-semibold text-[#1F2937] tracking-tight flex items-center gap-1.5">
            광고 제거
            <span class="inline-flex items-center px-1.5 py-0.2 rounded text-[10px] font-medium bg-[#EDF2FF] text-[#3B5BDB]">PRO</span>
</h2>
<p class="text-xs text-[#6B7280] font-normal leading-relaxed">
            광고 없이 온전히 퍼즐에 집중하세요
          </p>
</div>
<div class="w-8 h-8 rounded-full bg-[#F5F6FA] flex items-center justify-center text-[#3B5BDB] shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" data-icon="block">block</span>
</div>
</div>
<button class="w-full bg-[#EDF2FF] text-[#3B5BDB] hover:bg-[#dbe4ff] rounded-[14px] min-h-[48px] flex items-center justify-center font-semibold text-sm active:scale-[0.99] transition-colors duration-150" type="button">
        평생 광고 제거
      </button>
</section>
