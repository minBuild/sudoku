<script>
    // Lightweight micro-interaction for difficulty card switching
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('label');
      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => {
            c.classList.remove('bg-surface-container-low', 'border-2', 'border-primary-container', 'ring-1', 'ring-primary-container/20');
            c.classList.add('bg-surface-container-lowest', 'border', 'border-outline-variant/60');
            const radio = c.querySelector('.rounded-full.shrink-0');
            if (radio) {
              radio.className = 'w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0';
              radio.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>';
            }
          });
          
          card.classList.remove('bg-surface-container-lowest', 'border-outline-variant/60');
          card.classList.add('bg-surface-container-low', 'border-2', 'border-primary-container', 'ring-1', 'ring-primary-container/20');
          const activeRadio = card.querySelector('.rounded-full.shrink-0');
          if (activeRadio) {
            activeRadio.className = 'w-6 h-6 rounded-full bg-primary-container flex items-center justify-center shrink-0 text-on-primary shadow-sm';
            activeRadio.innerHTML = '<span class="material-symbols-outlined text-base font-bold" data-icon="check">check</span>';
          }
        });
      });
    });
  </script>
