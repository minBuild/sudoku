</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-secondary hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>

<div class="flex flex-col items-center justify-center my-auto py-2">
<div class="w-16 h-16 rounded-2xl bg-surface-container-low border border-primary/20 flex items-center justify-center mb-3 shadow-sm">

</div>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface tracking-tight mb-1">스도쿠</h1>
<p class="text-body-sm font-body-sm text-secondary">차분하게 한 칸씩</p>
</div>
<!-- Center & Bottom Action Blocks -->
<div class="space-y-3.5 w-full">
<!-- 이어하기 (Resume Card) -->
<div class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-4 shadow-sm flex items-center justify-between">
<div class="space-y-1">
<div class="flex items-center gap-2">
<span class="text-label-md font-label-md font-semibold text-on-surface">이어하기</span>
<span class="text-label-sm font-label-sm px-2 py-0.5 rounded-full bg-primary-fixed text-primary font-medium">보통</span>
</div>
<p class="text-body-sm font-body-sm text-secondary">진행률 42% · 05:24</p>
</div>
<button class="w-9 h-9 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-xl" data-icon="play_arrow">play_arrow</span>
</button>
</div>

</button>

<div class="pr-3">

<span class="material-symbols-outlined text-lg" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>

<div class="pr-3">

<p class="font-semibold text-base text-slate-800 group-hover:text-primary transition-colors">전문가</p>

<div class="w-32 h-1 bg-slate-200 rounded-full"></div>
