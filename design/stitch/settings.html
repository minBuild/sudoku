<body class="bg-background text-on-surface min-h-screen flex flex-col items-center selection:bg-primary-fixed">

<div class="flex-1">
<div class="text-label-lg font-label-lg text-on-surface">즉시 체크</div>
<p class="text-body-sm font-body-sm text-secondary mt-0.5">입력 즉시 틀린 숫자 표시</p>
</div>

<button aria-checked="true" class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary-container" onclick="toggleSwitch(this)" role="switch" type="button">
<span class="sr-only">즉시 체크 토글</span>
<span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-container-lowest shadow-sm ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>

<div class="flex-1">
<div class="text-label-lg font-label-lg text-on-surface">숫자 중복 강조</div>
<p class="text-body-sm font-body-sm text-secondary mt-0.5">동일한 숫자의 가로·세로·구역 강조</p>
</div>
<!-- Toggle (ON) -->
<button aria-checked="true" class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary-container" onclick="toggleSwitch(this)" role="switch" type="button">
<span class="sr-only">숫자 중복 강조 토글</span>
<span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-container-lowest shadow-sm ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>

        정관 스도쿠 (Jeonggwan Sudoku)
      </p>
</footer>
</div>
<!-- Micro-interactions Script -->
<script>
    function toggleSwitch(element) {
      const isChecked = element.getAttribute('aria-checked') === 'true';
      const newState = !isChecked;
      element.setAttribute('aria-checked', String(newState));
      
      const thumb = element.querySelector('span:not(.sr-only)');
      if (newState) {
        element.classList.remove('bg-surface-dim');
        element.classList.add('bg-primary-container');
        thumb.classList.remove('translate-x-0');
        thumb.classList.add('translate-x-5');
      } else {
        element.classList.remove('bg-primary-container');
        element.classList.add('bg-surface-dim');
        thumb.classList.remove('translate-x-5');
        thumb.classList.add('translate-x-0');
      }
    }
  </script>
